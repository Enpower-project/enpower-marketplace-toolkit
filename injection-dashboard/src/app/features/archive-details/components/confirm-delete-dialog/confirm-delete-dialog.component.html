<h2 mat-dialog-title>
    <svg width="22" height="19" viewBox="0 0 22 19" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
            d="M0 19L11 0L22 19H0ZM11 16C11.2833 16 11.5208 15.9042 11.7125 15.7125C11.9042 15.5208 12 15.2833 12 15C12 14.7167 11.9042 14.4792 11.7125 14.2875C11.5208 14.0958 11.2833 14 11 14C10.7167 14 10.4792 14.0958 10.2875 14.2875C10.0958 14.4792 10 14.7167 10 15C10 15.2833 10.0958 15.5208 10.2875 15.7125C10.4792 15.9042 10.7167 16 11 16ZM10 13H12V8H10V13Z"
            fill="#BA1A1A" />
    </svg>

    Delete Entry
</h2>
<mat-dialog-content>
    <p>Are you sure you want to delete entry:</p>
    <p class="entry-id">{{ data.entryId }}</p>
    <p>This action <strong>cannot be undone</strong>.</p>

    <div class="confirmation-container">
        <label class="confirmation-label" for="confirmation">CONFIRMATION REQUIRED</label>
        <input class="confirmation-input" id="confirmation" type="text" placeholder="Type DELETE to confirm"
            [ngModel]="confirmationText()" (ngModelChange)="confirmationText.set($event)" />
    </div>

</mat-dialog-content>
<mat-dialog-actions align="end">
  <button class="cancel-btn" (click)="onCancel()">Cancel</button>
  <button class="delete-btn" [disabled]="!isConfirmed" (click)="onConfirm()">Delete Forever</button>
</mat-dialog-actions>
