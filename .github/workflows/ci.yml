name: CI

# Runs the automated test suites and verifies that every container image in the
# Docker Compose deployment still builds. The image job exists because a missing
# directory once broke the backend image without any test noticing.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: Smart contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flexibility-market-smartcontracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: flexibility-market-smartcontracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run test suite
        run: npx hardhat test

      - name: Measure coverage
        run: npx hardhat coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-coverage
          path: flexibility-market-smartcontracts/coverage/
          if-no-files-found: ignore

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketplace-be
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: marketplace-be/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run test suite
        run: npm test

      - name: Verify the application compiles
        run: npm run build

  ingestion-microservice:
    name: Data Space ingestion microservice
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dataspace-file-ingestion-microservice
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run test suite
        run: ./mvnw -B test

  images:
    name: Container images
    runs-on: ubuntu-latest
    # The marketplace-fe image is deliberately absent from this matrix. Its
    # package.json declares dst-ui-kit, a component library published only to a
    # private registry, so the image cannot be built without credentials for
    # that registry. Building it here would fail on every run for a reason this
    # workflow cannot act on. To cover it, publish dst-ui-kit to a registry the
    # workflow can read and add a `frontend` entry below.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: marketplace-be
          - name: ingestion-microservice
            context: dataspace-file-ingestion-microservice
          - name: ingestion-dashboard
            context: injection-dashboard
          - name: hardhat-node
            context: flexibility-market-smartcontracts
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
