server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to NestJS backend container
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 50m;
  }

  # Proxy blockchain JSON-RPC to Hardhat container
  location /blockchain/ {
    proxy_pass http://hardhat:8545/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Angular SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /assets/silent-check-sso {
    default_type text/html;
    try_files /assets/silent-check-sso.html =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location = /assets/silent-check-sso.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }
}
