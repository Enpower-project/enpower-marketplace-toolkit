<!-- Auth Loading Overlay -->
<section class="auth-loading" *ngIf="isAuthenticationLoading">
  <div class="spinner-ring"></div>
  <p>{{ 'common.loading' | translate }}</p>
  <span>{{ 'landing.loading.pleaseWait' | translate }}</span>
</section>

<!-- Main Landing -->
<div class="landing-wrapper" *ngIf="!isAuthenticationLoading">

  <!-- ── Hero Section ── -->
  <section class="hero">

    <!-- Top Bar -->
    <div class="top-bar">
      <img
        src="assets/images/Logo Dst - Black.png"
        alt="Enpower Marketplace"
        class="top-logo"
      />
    </div>

    <!-- Central Card -->
    <div class="card-container">
      <div class="card">

        <!-- Logo -->
        <div class="card-icon">
          <img src="assets/images/logo.png" alt="Enpower Marketplace" />
        </div>

        <p class="description">{{ 'landing.welcome.description' | translate }}</p>

        <!-- Not logged in -->
        <ng-container *ngIf="!isLoggedIn">
          <button class="access-btn" (click)="login()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            {{ 'landing.cta.access' | translate }}
          </button>
        </ng-container>

        <!-- Logged in -->
        <ng-container *ngIf="isLoggedIn">
          <p class="welcome-msg">
            {{ 'landing.welcome.welcomeBack' | translate }}, {{ username }}!
          </p>
          <div class="logged-actions">
            <button class="access-btn" (click)="goToMarkets()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
              </svg>
              {{ 'landing.cta.goToMarkets' | translate }}
            </button>
            <button class="logout-btn" (click)="logout()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              {{ 'landing.cta.logout' | translate }}
            </button>
          </div>
        </ng-container>

      </div>
    </div>

    <!-- Hero Footer -->
    <div class="hero-footer">
      <div class="eu-badge">
        <img src="assets/images/logo-H2020.png" alt="Co-funded by the European Union" class="eu-img" />
      </div>
      <div class="copyright">{{ 'landing.footer.copyright' | translate }}</div>
    </div>

  </section>
