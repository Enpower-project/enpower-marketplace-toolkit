<div class="reactivate-container">
    <div class="reactivate-header">
        <h2 mat-dialog-title>Are you sure you want to Reactivate the user <span class="username">{{data.username}}</span>?</h2>
        <button mat-icon-button class="close-button" (click)="close()">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <mat-dialog-content class="reactivate-content">
        <p>If you reactivate this user they will have access to its assigned market again</p>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button mat-button class="close-button" (click)="close()">Close</button>
        <button mat-button class="reactivate-button" (click)="reactivateUser()">Reactivate user</button>
    </mat-dialog-actions>
</div>
