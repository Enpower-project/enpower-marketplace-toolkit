# Test configuration for the Dataspace File Ingestion Microservice.
#
# The deployed service runs against PostgreSQL with Flyway-managed migrations.
# Tests instead use an in-memory H2 database in PostgreSQL compatibility mode and
# let Hibernate derive the schema from the entity mappings, so that the
# application context can be loaded without any external service. This makes
# `contextLoads` a genuine smoke test: it verifies that the Spring context starts
# and that every JPA entity maps.

spring.datasource.url=jdbc:h2:mem:dfim-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Migrations target PostgreSQL specifically, so they are not applied against H2.
spring.flyway.enabled=false

# Keep the file store inside the build directory rather than the deployment path.
app.storage.base-path=${java.io.tmpdir}/dfim-test-files
