spring:
  application:
    name: dataspace-ingestion-microservice

app:
  storage:
    base-path: /data/dfim/files

  datasource:
    url: jdbc:postgresql://192.168.4.135:5432/dataspace_ingestion
    username: dataspace
    password: dataspace
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0



