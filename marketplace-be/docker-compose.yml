version: '3.8'

services:
  hardhat:
    build: ./hardhat_node
    container_name: hardhat
    ports:
      - "8545:8545"
    # INVESTIGATE PERSISTENCE
    # volumes:
    #  - hardhat_data:/app
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  mongodb:
    build: ./db
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27018:27017"
    restart: always
    volumes:
     - ./mongo_data:/data/db

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_FRONTEND_URL: http://localhost:9080
      KC_CACHE: local
      KC_THEME_CACHE_THEMES: "true"
      KC_THEME_CACHE_TEMPLATES: "true"
    depends_on:
      - postgres
    ports:
      - "9080:8080"
    volumes:
      - ./keycloak-data/themes:/opt/keycloak/themes
      - ./keycloak-data/data:/opt/keycloak/data
      - ./keycloak-data/conf:/opt/keycloak/conf

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MH_STORAGE: "maildir"
    restart: always
    volumes:
      - mailhog_data:/mailhog/data

  kong-database:
    image: postgres:15
    container_name: kong-database
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
    volumes:
      - ./kong_data:/var/lib/postgresql/data

  kong-migrations:
    image: kong:latest
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    depends_on:
      - kong-database
    restart: on-failure

  kong:
    image: kong:latest
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    depends_on:
      - kong-migrations
    restart: unless-stopped

  konga:
    image: pantsel/konga:latest
    container_name: konga
    environment:
      - NODE_ENV=development
    ports:
      - "1337:1337"
    depends_on:
      - kong
    volumes:
      - ./konga_data:/app/kongadata

  n8n:
    image: n8nio/n8n:1.44.0
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
    volumes:
      - ./n8n_data:/home/node/.n8n

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    restart: unless-stopped
    volumes:
    - ./backend_data:/usr/src/app


# frontend:
#   build: ./frontend
#   ports:
#     - "4200:4200"
#   depends_on:
#     - backend
#   restart: unless-stopped
#   volumes:
#     - ./frontend:/usr/src/app


  

volumes:
  postgres_data:
    name: postgres_data
  kong_data:
    name: kong_data
  konga_data:
    name: konga_data
  mongo_data:
    name: mongo_data
  n8n_data:
    name: n8n_data
  backend_data:
    name: backend_data
  keycloak_data:
    name: keycloak_data
  hardhat_data:
    name: hardhat_data
  mailhog_data:
    name: mailhog_data

  


